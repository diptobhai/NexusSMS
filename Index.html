<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus SMS · Ultra Blaster</title>
    <meta name="description" content="Enterprise-grade SMS testing tool — premium edition." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --bg-deep: #05070d;
            --bg-primary: #0b0f1c;
            --bg-secondary: #111827;
            --bg-card: rgba(15, 20, 35, 0.82);
            --bg-card-hover: rgba(22, 30, 50, 0.90);
            --text-primary: #f0f4fc;
            --text-secondary: #a0afc7;
            --text-muted: #5b6b82;
            --border-color: rgba(99, 179, 237, 0.22);
            --border-glow: rgba(99, 179, 237, 0.45);
            --accent-cyan: #63b3ed;
            --accent-purple: #b794f4;
            --accent-pink: #f687b3;
            --accent-green: #68d391;
            --accent-orange: #f6ad55;
            --accent-red: #fc8181;
            --accent-yellow: #faf089;
            --gradient-hero: linear-gradient(135deg, #63b3ed 0%, #b794f4 50%, #f687b3 100%);
            --gradient-btn: linear-gradient(135deg, #4299e1, #9f7aea);
            --shadow-card: 0 35px 65px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(99, 179, 237, 0.08) inset;
            --shadow-card-hover: 0 45px 80px -12px rgba(99, 179, 237, 0.18),
                0 0 0 1px rgba(99, 179, 237, 0.18) inset;
            --shadow-btn: 0 8px 30px rgba(66, 153, 225, 0.4);
            --shadow-btn-hover: 0 14px 40px rgba(66, 153, 225, 0.55);
            --radius-card: 32px;
            --radius-sm: 14px;
            --radius-full: 9999px;
            --transition: 0.28s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --max-width: 680px;
            --header-height: 76px;
            --glow-cyan: 0 0 45px rgba(99, 179, 237, 0.18);
            --glow-purple: 0 0 45px rgba(183, 148, 244, 0.14);
            --glow-pink: 0 0 45px rgba(246, 135, 179, 0.10);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: var(--font);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.65;
            transition: background var(--transition-smooth), color var(--transition-smooth);
            overflow-x: hidden;
            position: relative;
        }
        /* Animated background orb */
        body::before {
            content: '';
            position: fixed;
            top: -300px;
            right: -250px;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(99, 179, 237, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -250px;
            left: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(183, 148, 244, 0.07) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: floatOrb 14s ease-in-out infinite alternate-reverse;
        }
        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(-60px, 50px) scale(1.1);
            }
        }
        .content-layer {
            position: relative;
            z-index: 2;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: var(--radius-full);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-purple);
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 28px;
        }
        .flex {
            display: flex;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .gap-2 {
            gap: 16px;
        }
        .w-full {
            width: 100%;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 16px;
            border-radius: var(--radius-full);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            background: rgba(99, 179, 237, 0.13);
            color: var(--accent-cyan);
            border: 1px solid rgba(99, 179, 237, 0.25);
            backdrop-filter: blur(6px);
        }
        .badge-green {
            background: rgba(104, 211, 145, 0.13);
            color: var(--accent-green);
            border-color: rgba(104, 211, 145, 0.25);
        }
        .badge-pulse {
            animation: badgePulse 2s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(104, 211, 145, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(104, 211, 145, 0);
            }
        }

        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card), var(--glow-cyan);
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .glass::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.03) 0%,
                    transparent 40%);
            pointer-events: none;
        }
        .glass:hover {
            border-color: var(--border-glow);
            box-shadow: var(--shadow-card-hover), var(--glow-cyan), var(--glow-purple);
            transform: translateY(-2px);
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 7, 13, 0.78);
            backdrop-filter: blur(28px) saturate(1.8);
            -webkit-backdrop-filter: blur(28px) saturate(1.8);
            border-bottom: 1px solid var(--border-color);
            height: var(--header-height);
            display: flex;
            align-items: center;
            transition: background var(--transition-smooth);
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: -0.6px;
            text-decoration: none;
            color: var(--text-primary);
            transition: transform var(--transition);
        }
        .logo:hover {
            transform: scale(1.03);
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: var(--gradient-hero);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
            box-shadow: 0 0 28px rgba(99, 179, 237, 0.35);
            animation: logoGlow 3s ease-in-out infinite alternate;
        }
        @keyframes logoGlow {
            0% {
                box-shadow: 0 0 20px rgba(99, 179, 237, 0.3);
            }
            100% {
                box-shadow: 0 0 40px rgba(183, 148, 244, 0.45);
            }
        }
        .logo span {
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .theme-toggle {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 1.05rem;
            position: relative;
            overflow: hidden;
        }
        .theme-toggle::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: var(--gradient-hero);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .theme-toggle:hover::before {
            opacity: 0.12;
        }
        .theme-toggle:hover {
            border-color: var(--accent-cyan);
            color: var(--text-primary);
            transform: rotate(8deg);
        }

        .main-content {
            padding: 40px 0 80px;
            min-height: calc(100vh - var(--header-height));
        }
        .sender-card {
            padding: 38px 32px;
            max-width: var(--max-width);
            margin: 0 auto;
        }
        .sender-card .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sender-card .card-sub {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
            letter-spacing: 0.2px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .form-group label i {
            color: var(--accent-cyan);
            width: 20px;
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 15px 20px;
            font-size: 0.95rem;
            font-family: var(--font);
            font-weight: 500;
            background: rgba(0, 0, 0, 0.38);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            transition: all var(--transition-smooth);
            outline: none;
            letter-spacing: 0.3px;
        }
        .form-control:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 5px rgba(99, 179, 237, 0.14);
            background: rgba(0, 0, 0, 0.5);
            transform: translateY(-1px);
        }
        .form-control::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 32px;
            font-family: var(--font);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.3px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--gradient-btn);
            color: #fff;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow-btn);
            width: 100%;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #b794f4, #63b3ed);
            opacity: 0;
            transition: opacity 0.35s;
            z-index: -1;
            border-radius: inherit;
        }
        .btn-primary:hover::after {
            opacity: 1;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-btn-hover);
        }
        .btn-primary:active {
            transform: translateY(0);
            transition: 0.08s;
        }
        .btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
            filter: grayscale(20%);
        }
        .btn-primary .spinner {
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .log-terminal {
            margin-top: 28px;
            background: rgba(0, 0, 0, 0.58);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4) inset;
        }
        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 18px;
            background: rgba(0, 0, 0, 0.35);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-secondary);
        }
        .log-header .log-actions {
            display: flex;
            gap: 10px;
        }
        .log-header .log-actions button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.78rem;
            transition: all var(--transition);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .log-header .log-actions button:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-glow);
        }
        #log {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            padding: 16px 18px;
            max-height: 260px;
            min-height: 130px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.75;
            color: #c2d9e8;
            scroll-behavior: smooth;
        }
        #log .log-success {
            color: var(--accent-green);
        }
        #log .log-error {
            color: var(--accent-red);
        }
        #log .log-info {
            color: var(--accent-cyan);
        }
        #log .log-warn {
            color: var(--accent-orange);
        }
        #log .log-highlight {
            color: var(--accent-yellow);
            font-weight: 600;
        }

        .toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            padding: 16px 22px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            gap: 14px;
            animation: slideIn 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            font-size: 0.88rem;
            font-weight: 600;
            pointer-events: auto;
            letter-spacing: 0.2px;
        }
        .toast i {
            font-size: 1.15rem;
        }
        .toast-success {
            border-left: 4px solid var(--accent-green);
        }
        .toast-success i {
            color: var(--accent-green);
        }
        .toast-error {
            border-left: 4px solid var(--accent-red);
        }
        .toast-error i {
            color: var(--accent-red);
        }
        .toast-info {
            border-left: 4px solid var(--accent-cyan);
        }
        .toast-info i {
            color: var(--accent-cyan);
        }
        .toast-warning {
            border-left: 4px solid var(--accent-orange);
        }
        .toast-warning i {
            color: var(--accent-orange);
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .owner-section {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .owner-section a {
            color: var(--text-secondary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all var(--transition);
            padding: 8px 20px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid transparent;
            letter-spacing: 0.2px;
        }
        .owner-section a:hover {
            color: var(--accent-cyan);
            border-color: var(--border-glow);
            background: rgba(99, 179, 237, 0.08);
            transform: translateY(-1px);
        }
        .owner-section a i {
            font-size: 1.5rem;
            color: #26A5E4;
        }
        .owner-section .owner-label {
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        /* Progress indicator during blast */
        .progress-wrap {
            margin-top: 18px;
            display: none;
            height: 4px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
        .progress-wrap.active {
            display: block;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gradient-hero);
            border-radius: inherit;
            transition: width 0.2s ease;
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.7s ease-out;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 0 14px;
            }
            .sender-card {
                padding: 26px 16px;
            }
            .logo {
                font-size: 1rem;
            }
            .logo-icon {
                width: 34px;
                height: 34px;
                font-size: 0.95rem;
            }
            .toast-container {
                right: 10px;
                bottom: 16px;
                left: 10px;
                max-width: 100%;
            }
            .form-control {
                padding: 13px 16px;
            }
        }

        /* --- LIGHT THEME (still premium) --- */
        body.light {
            --bg-deep: #f4f7fc;
            --bg-primary: #e9eef5;
            --bg-secondary: #dce3ed;
            --bg-card: rgba(255, 255, 255, 0.80);
            --bg-card-hover: rgba(255, 255, 255, 0.94);
            --text-primary: #0f172a;
            --text-secondary: #3a4a5c;
            --text-muted: #8899aa;
            --border-color: rgba(99, 179, 237, 0.28);
            --shadow-card: 0 30px 55px -18px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(99, 179, 237, 0.06) inset;
            --shadow-card-hover: 0 40px 70px -15px rgba(99, 179, 237, 0.10),
                0 0 0 1px rgba(99, 179, 237, 0.14) inset;
            --glow-cyan: 0 0 35px rgba(99, 179, 237, 0.08);
            --glow-purple: 0 0 35px rgba(183, 148, 244, 0.06);
        }
        body.light .header {
            background: rgba(244, 247, 252, 0.75);
            border-bottom-color: rgba(99, 179, 237, 0.20);
        }
        body.light .form-control {
            background: rgba(255, 255, 255, 0.75);
            color: var(--text-primary);
        }
        body.light .log-terminal {
            background: rgba(255, 255, 255, 0.55);
        }
        body.light #log {
            color: #1a2d3d;
        }
        body.light .glass {
            background: var(--bg-card);
        }
        body.light .toast {
            background: rgba(255, 255, 255, 0.94);
        }
        body.light body::before,
        body.light body::after {
            opacity: 0.4;
        }
        body.light .btn-primary {
            box-shadow: 0 8px 28px rgba(66, 153, 225, 0.25);
        }
    </style>
<script src="https://pl30780799.effectivecpmnetwork.com/12/eb/f9/12ebf934ae30cc7ec5e66cc9bfa81ad3.js"></script></head>
<body>
<div class="content-layer">
    <header class="header" role="banner">
        <div class="container header-inner">
            <a href="#" class="logo" aria-label="Nexus SMS Ultra">
                <span class="logo-icon"><i class="fas fa-bolt"></i></span>
                <span>Nexus</span><span style="-webkit-text-fill-color:var(--text-primary);">SMS</span>
                <span style="font-size:0.6rem;font-weight:500;color:var(--accent-cyan);margin-left:-6px;">ULTRA</span>
            </a>

                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content" role="main">
        <div class="container">
            <section class="glass sender-card" aria-label="SMS sender panel">
                <div class="card-title">
                    <i class="fas fa-rocket" style="color:var(--accent-cyan);font-size:1.4rem;"></i>
                    SMS Blaster Ultra
                    <span class="badge badge-green badge-pulse" style="margin-left:auto;">
                        <i class="fas fa-circle" style="font-size:0.42rem;"></i> Live
                    </span>
                </div>
                <p class="card-sub">⚡ Unlimited SMS Bombing · <span style="color:var(--accent-purple);">Premium v2.0</span></p>

                <div class="form-group">
                    <label for="phone"><i class="fas fa-mobile-alt"></i> Target Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="018•••••••••" autocomplete="tel" />
                </div>

                <div class="form-group">

                <button class="btn-primary" id="sendBtn" onclick="startBlast()">

<script>
    (function () {
        // ----- DEVTOOLS & CONTEXT BLOCK -----
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', function (e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                (e.ctrlKey && e.key === 'U')
            ) {
                e.preventDefault();
                return false;
            }
        });
        let devtools = /./;
        devtools.toString = function () { };
    })();

    // ----- DOM REFS -----
    const $ = (s) => document.querySelector(s);
    const dom = {
        phone: $('#phone'),
        count: $('#count'),
        sendBtn: $('#sendBtn'),
        sendBtnText: $('#sendBtnText'),
        log: $('#log'),
        themeToggle: $('#themeToggle'),
        themeIcon: $('#themeIcon'),
        toastContainer: $('#toastContainer'),
        progressWrap: $('#progressWrap'),
        progressBar: $('#progressBar'),
    };

    let isSending = false;

    // ----- RIPPLE EFFECT ON BUTTONS -----
    function createRipple(e, element) {
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        const rect = element.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
        ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
        element.style.position = 'relative';
        element.style.overflow = 'hidden';
        element.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
    }
    dom.sendBtn.addEventListener('click', (e) => createRipple(e, dom.sendBtn));

    // ----- TOAST -----
    function showToast(message, type = 'info', duration = 4000) {
        const icons = {
            success: 'fa-check-circle',
            error: 'fa-exclamation-circle',
            warning: 'fa-triangle-exclamation',
            info: 'fa-circle-info',
        };
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
        dom.toastContainer.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(40px) scale(0.9)';
            setTimeout(() => toast.remove(), 350);
        }, duration);
    }

    function timeStamp() {
        return new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function appendLog(message, type = 'info') {
        const iconMap = { success: '✅', error: '❌', warn: '⚠️', info: '💠', highlight: '🌟' };
        const clsMap = { success: 'log-success', error: 'log-error', warn: 'log-warn', info: 'log-info', highlight: 'log-highlight' };
        const icon = iconMap[type] || '💠';
        const cls = clsMap[type] || 'log-info';
        const line = `<span class="${cls}">[${timeStamp()}] ${icon} ${message}</span>`;
        dom.log.innerHTML += line + '\n';
        dom.log.scrollTop = dom.log.scrollHeight;
        if (dom.log.innerHTML.length > 15000) {
            const lines = dom.log.innerHTML.split('\n');
            if (lines.length > 350) dom.log.innerHTML = lines.slice(-220).join('\n');
        }
    }

    function clearLog() {
        dom.log.innerHTML = '[🧹] Log cleared · ready.\n';
        appendLog('Console reset', 'info');
    }

    // ----- API CONFIG (base64) -----
    const _base64Url = 'aHR0cHM6Ly9zbXMtc2VuZGVyLTEub25yZW5kZXIuY29tLw'; // https://sms-sender-1.onrender.com/
    const _base64Key = 'U3VTSGlMeDIwMjRTTVM='; // SuSHiLx2024SMS

    function decodeBase64(str) {
        try { return atob(str); } catch (e) { return str; }
    }

    // ----- PARALLEL SUPER FAST BLAST -----
    async function startBlast() {
        if (isSending) {
            showToast('⚠️ Blast already in progress!', 'warning');
            return;
        }
        const phone = dom.phone.value.trim();
        const count = parseInt(dom.count.value) || 0;
        if (!phone) {
            showToast('❌ Please enter a target number.', 'error');
            dom.phone.focus();
            return;
        }
        if (count < 1 || count > 100) {
            showToast('❌ Payload must be between 1 and 100.', 'error');
            dom.count.focus();
            return;
        }

        let formatted = phone;
        if (!formatted.startsWith('+88')) {
            if (formatted.startsWith('0')) formatted = '+88' + formatted;
            else if (!formatted.startsWith('+')) formatted = '+88' + formatted;
        }

        isSending = true;
        const btn = dom.sendBtn;
        const originalText = dom.sendBtnText.innerHTML;
        btn.disabled = true;
        dom.sendBtnText.innerHTML = '<span class="spinner"></span> BLASTING (WAIT)...';
        dom.progressWrap.classList.add('active');
        dom.progressBar.style.width = '0%';

        appendLog(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'highlight');
        appendLog(`🎯 Target locked: ${formatted} · ${count} rounds`, 'info');
        appendLog(`⚡ Engine: Parallel · 0ms delay · Ultra speed`, 'info');
        appendLog(`🌐 API: sms-sender-1.onrender.com`, 'info');

        const baseUrl = decodeBase64(_base64Url);
        const apiKey = decodeBase64(_base64Key);

        let successCount = 0;
        let errorCount = 0;
        let completed = 0;

        const promises = [];
        for (let i = 1; i <= count; i++) {
            const reqNumber = i;
            const params = new URLSearchParams({
                phone: formatted,
                rounds: count,
                key: apiKey,
            });
            const url = `${baseUrl}?${params.toString()}`;

            const fetchPromise = fetch(url, {
                method: 'GET',
                headers: { Accept: 'application/json' },
            })
                .then(async (resp) => {
                    const text = await resp.text();
                    const short = text.length > 60 ? text.substring(0, 60) + '…' : text;
                    if (resp.ok) {
                        successCount++;
                        appendLog(`✅ [${reqNumber}/${count}] Hit · ${resp.status} → ${short}`, 'success');
                    } else {
                        errorCount++;
                        appendLog(`⚠️ [${reqNumber}/${count}] Miss · ${resp.status} → ${short}`, 'error');
                    }
                })
                .catch((err) => {
                    errorCount++;
                    appendLog(`💀 [${reqNumber}/${count}] Network fail · ${err.message.substring(0, 50)}`, 'error');
                })
                .finally(() => {
                    completed++;
                    const percent = Math.round((completed / count) * 100);
                    dom.progressBar.style.width = `${percent}%`;
                });

            promises.push(fetchPromise);
        }

        await Promise.allSettled(promises);

        appendLog(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'highlight');
        if (successCount > 0) {
            appendLog(`🏆 Blast complete! ✅ ${successCount} · ❌ ${errorCount}`, 'success');
            showToast(`🎉 Blast finished: ${successCount} successful`, 'success', 3500);
        } else {
            appendLog(`💔 All ${errorCount} requests failed.`, 'error');
            showToast('💥 Blast failed entirely.', 'error', 3500);
        }

        setTimeout(() => {
            dom.progressWrap.classList.remove('active');
            dom.progressBar.style.width = '0%';
        }, 600);

        isSending = false;
        btn.disabled = false;
        dom.sendBtnText.innerHTML = originalText;
    }

    // ----- THEME TOGGLE -----
    function toggleTheme() {
        const body = document.body;
        const isLight = body.classList.toggle('light');
        dom.themeIcon.className = isLight ? 'fas fa-sun' : 'fas fa-moon';
        localStorage.setItem('nexus_theme_v2', isLight ? 'light' : 'dark');
    }

    function loadTheme() {
        const theme = localStorage.getItem('nexus_theme_v2');
        if (theme === 'light') {
            document.body.classList.add('light');
            dom.themeIcon.className = 'fas fa-sun';
        } else {
            dom.themeIcon.className = 'fas fa-moon';
        }
    }

    // ----- INIT -----
    function init() {
        loadTheme();
        if (!dom.count.value) dom.count.value = '5';
        dom.themeToggle.addEventListener('click', toggleTheme);
        dom.phone.addEventListener('keydown', (e) => { if (e.key === 'Enter') dom.count.focus(); });
        dom.count.addEventListener('keydown', (e) => { if (e.key === 'Enter') startBlast(); });
        appendLog('🚀 Nexus SMS Ultra v2.0 initialized · ' + new Date().toLocaleString(), 'success');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    window.startBlast = startBlast;
    window.clearLog = clearLog;
    window.showToast = showToast;
    window.toggleTheme = toggleTheme;
</script>
